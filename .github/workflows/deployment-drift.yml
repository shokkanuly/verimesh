name: Read-Only Deployment Gate
on:
  workflow_dispatch:
    inputs:
      fork_block:
        description: Explicit Monad testnet block for native fork tests
        required: true
        type: string
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:deployment
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      - run: pnpm test:fork
        env:
          MONAD_RPC_URL: https://testnet-rpc.monad.xyz
          MONAD_FORK_BLOCK: ${{ inputs.fork_block }}
