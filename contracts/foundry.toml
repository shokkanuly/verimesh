[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]
fs_permissions = [
    { access = "read", path = "../test-vectors" },
    { access = "read-write", path = "../deployments" }
]

[fuzz]
runs = 1000

[invariant]
runs = 50
depth = 50
